[package]
name = "xuvon-core"
version = "0.1.0"
edition = "2021"
description = "Xuvon Browser application core: settings, navigation policy, history, bookmarks, downloads metadata, workspace and privacy policy."
license = "MIT"

[[bin]]
name = "xuvon-core"
path = "src/main.rs"

[lib]
name = "xuvon_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
plist = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
